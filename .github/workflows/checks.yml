name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Test snapshot collection
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test and check the Chrome extension
        run: |
          node --test tests/extension.test.cjs
          for file in extension/*.js; do node --check "$file" || exit 1; done
      - name: Package the offline demo
        run: python3 scripts/package_extension.py --demo --output build/extension-demo
